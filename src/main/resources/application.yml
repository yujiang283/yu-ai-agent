server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://192.168.200.150:5432/postgres
    username: postgres
    password: 123456
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
# mybatis plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    #  仅在开发环节打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 逻辑删除
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值 （默认为1）
      logic-not-delete-value: 0 # 逻辑未删除值 （默认为0）
    enable-sql-runner: true

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yj.yuaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn